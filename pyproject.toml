[project]
name = "legal-assitant256"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjiworkzalott", email = "benjaminthompson1404@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "openai>=3.60.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
legal-assitant256 = "legal_assitant256:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors, I: import sorting, UP: modern Python, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]